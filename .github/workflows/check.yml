name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: shellcheck (every launcher script)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fail=0
          for f in $(find . -name "*.sh" -not -path "./.git/*"); do
            echo "== shellcheck $f"
            shellcheck --severity=error "$f" || fail=1
          done
          exit $fail
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml pytest numpy
      - name: unit tests for the checker
        run: python -m pytest tests -q
      - name: validate every recipe against the contract
        run: python scripts/check_recipe.py --all
      - name: index is up to date
        run: python scripts/render_index.py --check
